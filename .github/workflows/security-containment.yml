name: Security containment
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  containment:
    name: ChatMCP security containment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/security/containment.test.mjs
